spring:
  application:
    name: forum
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:forum
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  # habilita console do DB no navegador
  h2:
    console:
      enabled: true # acessar na URL - localhost:8080/h2-console